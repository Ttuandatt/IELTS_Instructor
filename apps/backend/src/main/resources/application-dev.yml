spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/teachy
    username: teachy
    password: teachy_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6380
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

teachy:
  jwt:
    secret: dev-secret-at-least-32-chars-long-change-in-prod
    access-expiry: 15m
    refresh-expiry: 7d
  gemini:
    api-key: ${GEMINI_API_KEY:}
    cheap-model: gemini-2.5-flash
    premium-model: gemini-2.5-pro
  uploads:
    path: ./uploads

server:
  port: 8080